<!DOCTYPE html>

<html>
    <head> 
        <!-- <link rel="stylesheet" href="mainPage.css"> -->
    </head>


    <body>

        <nav class="nav-links">
            <h1 class="logo">MyMarket</h1>

            <div class="nav-links">
                <li><a href="/"> Home </a></li>
                <li><a id="profileLink" href="#"> Profile </a></li>
                <li><a href="market.html"> Market </a></li>
                <li><a href=""> News </a></li>
            </div>

            <div class="auth-buttons">
                <button id="login"> Login </button>
                <button id="signup"> Sign Up </button>
            </div>
        </nav>
        
        <main class="posts">
            <form id="postForm">

                <select id="postType">
                    <option value="post">
                        Normal Post
                    </option>

                    <option value="trade">
                        Trade Post
                    </option>
                </select>

                <textarea
                    id="content"
                    placeholder="What's on your mind?"
                ></textarea>

                <div id="tradeFields" style="display:none;">

                    <input
                        type="text"
                        id="tradeOffer"
                        placeholder="Cards you're offering"
                    >

                    <input
                        type="text"
                        id="tradeWant"
                        placeholder="Cards you're looking for"
                    >
                </div>

                <button type="submit">
                    Post
                </button>

            </form>

            <div id="posts"></div>

        </main>

        <script src="./js/createAccount.js"></script>
        <script src="./js/index.js"></script>

    </body>
</html>
