        <form action="/signup" method="POST">

            <br>
            <input type="text"
                id="username"
                name="username"
                required
            >

            <br><br>
            <label for="email">Email</label>s

            <br>
            <input type="text"

                name="email"

            >

            <br>
            <input type="text"
                id="password"
                name="password"
                requred
            >

            <br>

            >
